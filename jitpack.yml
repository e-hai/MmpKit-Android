# JitPack build config — https://jitpack.io/docs/BUILDING/
jdk:
  - openjdk21
install:
  # Publish library modules only; skip sample/tests for a leaner build.
  - ./gradlew :mmp-core:publishReleasePublicationToMavenLocal
      :mmp-appsflyer:publishReleasePublicationToMavenLocal
      :mmp-adjust:publishReleasePublicationToMavenLocal
      -x test
      -x lint
      --no-configuration-cache
      --stacktrace
      --no-daemon
